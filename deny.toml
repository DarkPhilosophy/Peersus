# cargo-deny policy for the Rust workspace: advisories, licences, duplicate or banned crates and where
# crates may come from. Run by `.github/workflows/security.yml`; locally: `cargo deny check`.

[graph]
all-features = false

[advisories]
# Same advisory database as `cargo xtask audit`; an unmaintained crate is reported, not a failure,
# unless the project's own audit policy says otherwise.
yanked = "deny"
unmaintained = "none"

[licenses]
# The licences the dependency graph uses today, all permissive or file-level copyleft that is compatible
# with distributing the application under Apache-2.0. A new licence is a decision, not a default.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own unpublished tools (xtask) carry no licence field.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "canvas-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"

# An example extension, not a member of the application workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
peersus-api = { path = "../../crates/peersus-api" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

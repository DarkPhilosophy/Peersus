[package]
name = "hello-guest"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
# A guest is its own standalone crate, never a member of the application's workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[package]
name = "peersus-upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:rfd", "dep:keyring", "dep:arboard", "dep:peersus-api", "dep:peersus-plugin", "dep:rpassword"]

[dependencies]
reqwest = { workspace = true, features = ["multipart", "stream", "json"] }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
thiserror.workspace = true
rustix.workspace = true
sha2.workspace = true
tempfile.workspace = true
rfd = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
peersus-api = { workspace = true, optional = true }
peersus-plugin = { workspace = true, optional = true }

[[bin]]
name = "peersus-upload"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "peersus-upload-credential"
path = "src/bin/credential.rs"
required-features = ["desktop"]


[lints]
workspace = true

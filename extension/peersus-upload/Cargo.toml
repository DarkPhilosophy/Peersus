[package]
name = "peersus-upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:rfd", "dep:keyring", "dep:arboard", "dep:peersus-api", "dep:peersus-plugin", "dep:rpassword"]

[dependencies]
reqwest = { workspace = true, features = ["multipart", "stream", "json"] }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
thiserror.workspace = true
rustix.workspace = true
sha2.workspace = true
tempfile.workspace = true
rfd = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
peersus-api = { workspace = true, optional = true }
peersus-plugin = { workspace = true, optional = true }

[[bin]]
name = "peersus-upload"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "peersus-upload-credential"
path = "src/bin/credential.rs"
required-features = ["desktop"]


[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
peersus-api = { path = "../../crates/peersus-api" }
peersus-plugin = { path = "../../crates/peersus-plugin" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "multipart", "stream", "json"] }
rfd = "0.17"
rpassword = "=7.5.4"
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
url = "=2.5.8"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"

[patch.crates-io]
winit = { path = "../../vendor/winit" }
netwatch = { path = "../../vendor/netwatch" }
sctk-adwaita = { path = "../../vendor/sctk-adwaita" }
freya-core = { path = "../../vendor/freya-core" }
freya-components = { path = "../../vendor/freya-components" }
pulp = { path = "../../vendor/pulp" }
rav1e = { path = "../../vendor/rav1e" }
mundy = { path = "../../vendor/mundy" }
atspi = { path = "../../vendor/atspi" }
atspi-common = { path = "../../vendor/atspi-common" }
atspi-proxies = { path = "../../vendor/atspi-proxies" }
accesskit_atspi_common = { path = "../../vendor/accesskit_atspi_common" }
accesskit_unix = { path = "../../vendor/accesskit_unix" }
zbus-lockstep = { path = "../../vendor/zbus-lockstep" }
zbus-lockstep-macros = { path = "../../vendor/zbus-lockstep-macros" }
keyring = { path = "../../vendor/keyring" }

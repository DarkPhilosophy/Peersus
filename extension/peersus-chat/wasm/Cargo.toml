[package]
name = "peersus-chat-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
native = []
development-diagnostics = []

[dependencies]
peersus-api = { path = "../../../crates/peersus-api" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

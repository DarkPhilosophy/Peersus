[package]
name = "peersus-location-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# The same guest as a native library (second tier, not recommended): `cargo build --release --features native`.
native = []
# Matching development hosts only; normal modules have no diagnostic import.
development-diagnostics = []

[dependencies]
# Named for its traits only (a strict reading of a message); `serde_json` already brings it.
serde = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

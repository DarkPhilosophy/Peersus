[package]
name = "peersus-control-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

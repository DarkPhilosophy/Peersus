[package]
name = "peersus-monitor-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Named by the shared glue (`src/host.rs`, the one copy in `templates/guest/`). This guest is WebAssembly only and has no
# native build, so it does not enable `native`.
native = []
# Matching development hosts only; normal modules have no diagnostic import.
development-diagnostics = []

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

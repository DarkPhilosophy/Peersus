[package]
name = "peersus-plugin"
description = "Runs Peersus plugins for the application: the hub that routes their calls and each plugin's isolated process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Builds the deliberately misbehaving plugin used by the isolation tests. Never part of a
# normal build or of the product.
crash-test-plugin = []

[[bin]]
name = "crash-test-plugin"
path = "src/bin/crash_test_plugin.rs"
required-features = ["crash-test-plugin"]

[dependencies]
peersus-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["process", "rt", "io-util", "net", "time", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "peersus-plugin-api"
description = "Headless Peersus extension contract: manifests, contributions, messages and the application hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
# The notification and timer primitives, plus `select!` which the hub uses to wait for a
# delivery or a deadline. No runtime and no I/O: the host application supplies those.
# `macros` must be a normal dependency; keeping it dev-only compiled in tests but made
# the library itself fail to build for anyone depending on this crate alone.
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true

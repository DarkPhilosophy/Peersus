[package]
name = "peersus-diagnostics"
description = "Application-owned structured diagnostics for desktop and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Explicit development packaging, including optimized Android native libraries.
android-debug = []

[dependencies]
peersus-api.workspace = true
tracing.workspace = true
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "registry", "env-filter", "tracing-log"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tracing-appender = { version = "0.2.5", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2.0"

[dev-dependencies]
log = "0.4.34"

[lints]
workspace = true

// AGP's minimum Kotlin plugin still calls Gradle's deprecated setVisible API.
// This maintained version uses setInvisibleIfSupported during plugin initialization.
buildscript {
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
    }
}

plugins { id 'com.android.application' version '9.5.0' apply false }

// Keep generated Android files alongside Cargo output, never in the source tree.
layout.buildDirectory.set(file('../target/android/gradle/root'))
subprojects {
    layout.buildDirectory.set(rootProject.file("../target/android/gradle/${project.name}"))
}

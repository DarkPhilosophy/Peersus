pluginManagement { repositories { google(); mavenCentral() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Official verifier Android artifacts, pinned to an immutable upstream revision.
        exclusiveContent {
            forRepository {
                maven { url = uri('https://raw.githubusercontent.com/rustls/rustls-platform-verifier/1aa691352a5e0c215210dfc9a3c2f2078639dc91/android-release-support/maven/') }
            }
            filter { includeModule('org.rustls', 'rustls-platform-verifier') }
        }
    }
}
rootProject.name = 'Peersus'
include ':app'

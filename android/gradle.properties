android.useAndroidX=true
# The packager reads each native library whole (`zipflinger` `BytesSource`, ~50 MB a library and ABI) while the release splits
# are packaged side by side: with Gradle's default 512 MiB heap CI's `packagePlayRelease` ran out of it ("Java heap space",
# E-147). Setting this replaces Gradle's defaults, so the metaspace limit is named again.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m

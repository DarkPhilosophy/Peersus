version: 2

# Version updates target the default branch. Security updates also require the
# repository's Dependabot alerts/security-updates settings to be enabled.
# No auto-merge, private registry credentials or self-hosted runner is required.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    allow:
      - dependency-type: all
    groups:
      cargo-compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      android-compatible:
        applies-to: version-updates
        update-types:
          - minor
          - patch

name: Pull request metadata triage
on:
  pull_request_target:
    branches: [main, extension]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  # A reviewer finishing can make a PR ready for the maintainer. (Resolving a thread has no workflow event;
  # the next review, push or CI completion rechecks it.)
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Quality gates, Extension source submission, Generated documentation, Security audit]
    types: [completed]
  # By hand (Actions → Run workflow): refresh every open PR's labels, for example after a settings change.
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write
  issues: write
jobs:
  labels:
    name: PR metadata labels
    # A person's review (a reply in a thread, a comment, an approval) changes no label; only a reviewer bot's can.
    # Skipped here, it spends no runner and never takes the place of a pending run that matters.
    if: github.event_name != 'pull_request_review' || github.event.review.user.type == 'Bot'
    # Each PR apart: events on one PR fold into its newest pending run, and a PR's events never cancel another's.
    # A completed workflow names its PR when it ran on this repository's branch, else its head commit (a fork);
    # a run by hand refreshes them all.
    concurrency:
      group: triage-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || 'all' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Trusted default-branch code ONLY. Never checkout the PR head or execute
      # source, build recipes, titles or bodies supplied by the contributor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Refresh platform, artifact and current-head CI labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/triage-pull-request.py

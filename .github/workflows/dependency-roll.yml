name: Dependency roll into dev

# Folds every open Dependabot pull request into ONE commit on the `dev` branch, authored as the owner
# (repository variables DEV_COMMIT_NAME and DEV_COMMIT_EMAIL), then starts the quality gate on `dev`.
# Runs after Dependabot's Monday run, or by hand. Never touches `main`, never tags, never publishes.
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependency-roll
  cancel-in-progress: false

jobs:
  roll:
    name: Fold Dependabot pull requests into dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fold
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_COMMIT_NAME: ${{ vars.DEV_COMMIT_NAME }}
          DEV_COMMIT_EMAIL: ${{ vars.DEV_COMMIT_EMAIL }}
        run: python3 scripts/dependency-roll.py

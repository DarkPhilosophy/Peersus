name: Extension submission check
# Runs on pull requests that target the `extension` branch. The contributor's code is UNTRUSTED:
#   * `pull_request`, never `pull_request_target`: the fork's token is read-only and has no secrets;
#   * `permissions: contents: read` and nothing else, so it cannot write, comment, release or publish;
#   * the validator only READS the package; nothing from it is imported, loaded or executed here;
#   * the only output is a review report artifact. Admission is a separate, maintainer-only workflow.
on:
  pull_request:
    branches: [extension]
    paths: ['extensions/**']
permissions:
  contents: read
concurrency:
  group: extension-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate submitted packages (read-only, no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Data: the pull request's own tree. Read as bytes only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: submission
          fetch-depth: 0
          persist-credentials: false
      # Code: the BASE branch, so a pull request cannot weaken the validator that judges it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refuse a submission that changes anything but its own package
        shell: bash
        working-directory: submission
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # --no-renames: a rename is reported as a delete and an add, so moving a trusted file INTO extensions/ is seen.
          outside=$(git diff --no-renames --name-only "$BASE" HEAD | grep -v '^extensions/' || true)
          [ -z "$outside" ] || { echo "the submission changes files outside extensions/:"; echo "$outside"; exit 1; }
      - name: Validate every submitted package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          found=0
          for archive in submission/extensions/*.tar.gz; do
            [ -e "$archive" ] || continue
            found=1
            name=$(basename "$archive" .tar.gz)
            python3 trusted/scripts/validate-extension.py "$archive" --report="$RUNNER_TEMP/reports/$name.json"
          done
          [ "$found" = 1 ] || { echo "no extension archive under extensions/"; exit 1; }
      - name: Upload review reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: error
          retention-days: 30

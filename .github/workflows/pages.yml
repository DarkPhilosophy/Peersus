name: Website preview artifact

# Deliberately manual and artifact-only. This workflow cannot deploy a website.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test website staging and preview isolation
        run: python3 scripts/test-site-preview.py
      - name: Validate and stage static website
        run: python3 site/build.py --output "$RUNNER_TEMP/peersus-site" --test-catalog
      - name: Upload reviewable website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peersus-website-preview
          path: ${{ runner.temp }}/peersus-site/
          if-no-files-found: error
          retention-days: 14

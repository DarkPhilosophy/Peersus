name: Dependency advisory audit

# Detect new advisories even when the source tree has not changed.
# Push and PR audits already run in the full Quality gates workflow.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Strict Rust dependency audit (not runtime validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared Rust toolchain and pinned audit tool
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies with the existing strict policy
        run: cargo xtask audit

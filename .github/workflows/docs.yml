name: Generated documentation

on:
  # Only when a maintainer adds the `run:ci` label, or by hand.
  pull_request:
    types: [labeled]
    paths:
      - Cargo.toml
      - rust-toolchain.toml
      - crates/**/plugin.json
      - crates/**/plugin.toml
      - docs/changes.json
      - scripts/gen-docs.py
      - scripts/test-gen-docs.py
      - .github/workflows/**
      - README.md
      - CHANGELOG.md
      - .github/README.md
      - .github/CHANGELOG.md
  workflow_dispatch:

# Generation is local to the runner. No signing secret, owner impersonation,
# repository write permission, automatic commit, push or publication is needed.
permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run:ci'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test generation behavior
        run: python3 scripts/test-gen-docs.py
      - name: Regenerate marked sections
        run: python3 scripts/gen-docs.py
      - name: Upload generated documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-documentation
          path: |
            README.md
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 14
      - name: Check committed documentation matches its sources
        run: |
          if ! git diff --quiet -- README.md CHANGELOG.md .github/README.md .github/CHANGELOG.md; then
            echo 'Generated documentation is stale. Run python3 scripts/gen-docs.py and include its changes.'
            exit 1
          fi

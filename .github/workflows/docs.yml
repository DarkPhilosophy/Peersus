name: Generated documentation

on:
  push:
    paths:
      - Cargo.toml
      - rust-toolchain.toml
      - crates/**/plugin.json
      - crates/**/plugin.toml
      - docs/changes.json
      - scripts/gen-docs.py
      - scripts/test-gen-docs.py
      - .github/workflows/**
      - README.md
      - CHANGELOG.md
      - .github/README.md
      - .github/CHANGELOG.md
  pull_request:
    paths:
      - Cargo.toml
      - rust-toolchain.toml
      - crates/**/plugin.json
      - crates/**/plugin.toml
      - docs/changes.json
      - scripts/gen-docs.py
      - scripts/test-gen-docs.py
      - .github/workflows/**
      - README.md
      - CHANGELOG.md
      - .github/README.md
      - .github/CHANGELOG.md
  workflow_dispatch:

# Generation is local to the runner. No signing secret, owner impersonation,
# repository write permission, automatic commit, push or publication is needed.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test generation behavior
        run: python3 scripts/test-gen-docs.py
      - name: Regenerate marked sections
        run: python3 scripts/gen-docs.py
      - name: Upload generated documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-documentation
          path: |
            README.md
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 14
      - name: Check committed documentation matches its sources
        run: |
          if ! git diff --quiet -- README.md CHANGELOG.md .github/README.md .github/CHANGELOG.md; then
            echo 'Generated documentation is stale. Run python3 scripts/gen-docs.py and include its changes.'
            exit 1
          fi
